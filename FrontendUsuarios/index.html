<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-sacale=1.0">
    <title>Usuarios API</title>

    <link rel="stylesheet" href="styles.css" />

</head>
<body>
    <div class="container">
        <h1>Gestión de Usuarios</h1>

        <!--Formulario-->
        <div class="from-container">
            <h2>Crear Usuario</h2>
            <form id="usuarioForm">
                <input 
                       type="text"
                       id="nombre"
                       placeholder="Nombre"
                       required
                       />
                <input 
                       type="email"
                       id="email"
                       placeholder="Email"
                       required
                       />
                <input 
                       type="password"
                       id="password"
                       placeholder="Password"
                       required
                       />
                <button id="btnGuardar" type="submit">
                    Guardar Usuario
                </button>
            </form>
        </div>

        <!--Tabla-->
        <div class="table-container">
            <h2>Lista de Usuarios</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="usuariosBody">
                    <!--Usuarios dinámicos-->
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
