<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-sacale=1.0">
    <title>Usuarios API</title>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">
            CRUD Usuarios .NET
        </span>
    </div>
</nav>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-lg-4 mb-4">
                <div id="mensaje"></div>
                <!--Formulario-->
                <div class="card shadow mb-4">

                    <div class="card-header">
                        Crear Usuario
                    </div>

                    <div class="card-body">
                        <form id="usuarioForm">

                            <div class="mb-3">
                                <label class="form-label">
                                    Nombre
                                </label>

                                <input 
                                    type="text" 
                                    id="nombre" 
                                    class="form-control"
                                    required
                                    minlength="3">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Email
                                </label>

                                <input 
                                    type="email" 
                                    id="email" 
                                    class="form-control"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Password
                                </label>

                                <input 
                                    type="password" 
                                    id="password" 
                                    class="form-control"
                                    required
                                    minlength="4">
                            </div>

                            <button id="btnGuardar" type="submit" class="btn btn-primary">

                                Guardar Usuario

                            </button>

                        </form>
                    </div>

                </div>
            </div>
            <div class="col-lg-8">
                <!--Tabla-->
                <div class="table-responsive">
                    <h2>Lista de Usuarios</h2>
                    <table class="table table-striped table-hover">

                        <thead class="table-dark">

                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Acciones</th>
                            </tr>

                        </thead>

                        <tbody id="usuariosBody">

                        </tbody>

                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
